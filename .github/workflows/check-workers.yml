name: check-workers

on:
  pull_request:
    paths:
      - 'workers/**'
      - 'scripts/deploy.mjs'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare every worker with the live version (no deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfe736ca1eb7ad4f0556c29358a77eda
          DRY_RUN: '1'
        run: node scripts/deploy.mjs
